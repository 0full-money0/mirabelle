<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0b0b0d"><title>Mirabelle — accès réservé</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b0b0d'/%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%23e3a64a' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23d23b2e'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=IBM+Plex+Sans+Condensed:wght@400;600&family=VT323&display=swap">
<style>
:root{color-scheme:dark;--bg:#0b0b0d;--ink:#e6e0d4;--mute:#a8a093;--line:#26262b;--bone:#f1e9d8;--amber:#e3a64a;--rec:#d23b2e}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16.5px/1.5 'IBM Plex Sans Condensed','Arial Narrow',system-ui,sans-serif}
main{min-height:100%;display:grid;place-items:center;padding:24px 16px}
.box{width:min(420px,100%)}
.rec{font:22px/1 'VT323',monospace;color:var(--mute);letter-spacing:.06em}.rec b{color:var(--rec);font-weight:400}
h1{font:600 clamp(48px,12vw,72px)/.95 'Cormorant Garamond',Georgia,serif;color:var(--bone);margin:10px 0 6px}
p{color:var(--mute);margin:0 0 22px}
label{display:block;font:600 13px/1 'IBM Plex Sans Condensed',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);margin-bottom:8px}
input[type=password]{width:100%;font:24px/1.2 'VT323',monospace;letter-spacing:.12em;color:var(--bone);background:#141417;border:1px solid var(--line);border-radius:4px;padding:12px 14px;box-sizing:border-box}
input:focus-visible,button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.row{display:flex;align-items:center;gap:8px;margin:12px 0 18px;color:var(--mute);font-size:15px}
button{width:100%;font:600 15px/1 'IBM Plex Sans Condensed',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#0b0b0d;background:var(--amber);border:0;border-radius:4px;padding:14px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.msg{min-height:24px;margin-top:14px;font-size:15px;color:#ff9d8a}
</style></head><body><main><form class="box" id="f" autocomplete="off">
<div class="rec"><b>●</b> ACCÈS RÉSERVÉ</div><h1>Mirabelle</h1>
<p>Suivi du projet, réservé à l'équipe. Entrez le code d'accès.</p>
<label for="code">Code d'accès</label><input id="code" type="password" autocomplete="current-password" spellcheck="false" required>
<div class="row"><input id="keep" type="checkbox"><label for="keep" style="all:unset;cursor:pointer">Se souvenir de moi sur cet appareil</label></div>
<button id="go" type="submit">Entrer</button><div class="msg" id="msg" role="status"></div>
</form></main>
<script>
const KEYNAME = 'mirabelle-suivi-cle';
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
let blob = null; const getBlob = async () => blob || (blob = await (await fetch('site.enc', { cache: 'no-cache' })).json());
async function open(key) {
  const d = await getBlob();
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(d.iv) }, key, b64(d.ct));
  const html = new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
async function derive(code) {
  const d = await getBlob(); const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(d.salt), iterations: d.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
(async () => { // clé mémorisée sur cet appareil (si l'option a été cochée)
  let raw = null; try { raw = localStorage.getItem(KEYNAME); } catch (e) {}
  if (!raw) return;
  try { const k = await crypto.subtle.importKey('raw', b64(raw), { name: 'AES-GCM' }, false, ['decrypt']); await open(k); }
  catch (e) { try { localStorage.removeItem(KEYNAME); } catch (e2) {} }
})();
document.getElementById('f').addEventListener('submit', async (ev) => {
  ev.preventDefault(); const btn = document.getElementById('go'), msg = document.getElementById('msg');
  btn.disabled = true; btn.textContent = 'Vérification…'; msg.textContent = '';
  try {
    const key = await derive(document.getElementById('code').value.trim().toUpperCase());
    if (document.getElementById('keep').checked) { try { const raw = new Uint8Array(await crypto.subtle.exportKey('raw', key)); localStorage.setItem(KEYNAME, btoa(String.fromCharCode(...raw))); } catch (e) {} }
    await open(key);
  } catch (e) { btn.disabled = false; btn.textContent = 'Entrer'; msg.textContent = 'Code incorrect.'; }
});
</script></body></html>
